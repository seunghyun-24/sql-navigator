name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 같은 PR에 새 커밋이 오면 이전 실행을 취소해 러너 시간 절약
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Analyzer: Rule 단위 pytest ──────────────────────────────
  python-tests:
    name: Analyzer tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # Pyodide 런타임과 동일한 계열
          cache: pip
          cache-dependency-path: src/python/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r src/python/requirements-dev.txt

      - name: Run rule tests
        working-directory: src/python
        run: python -m pytest tests -v

      - name: Validate example queries (sqlglot parse)
        run: python examples/validate_examples.py

  # ── Frontend: 타입체크 + 빌드 ──────────────────────────────
  frontend:
    name: Frontend build (tsc + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        run: npm run build # = tsc && vite build
